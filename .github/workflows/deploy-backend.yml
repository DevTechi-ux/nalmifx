name: Deploy Backend Only

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: self-hosted

    steps:
      - name: Deploy Backend
        run: |
          cd /home/nalmifx/nalmifx
          git pull origin main
          cd backend
          npm install --production
          pm2 restart nalmifx-backend
          echo "✅ Backend deployment completed!"
