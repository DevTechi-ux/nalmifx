name: Deploy Frontend Only

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: self-hosted

    steps:
      - name: Deploy Frontend
        run: |
          cd /home/nalmifx/nalmifx
          git pull origin main
          cd frontend
          npm install
          npm run build
          echo "✅ Frontend deployment completed!"
