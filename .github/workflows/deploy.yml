name: Deploy NalmiFX

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          cd /home/nalmifx/nalmifx
          git pull origin main

          cd backend
          npm install --production
          pm2 restart nalmifx-backend || pm2 start server.js --name nalmifx-backend

          cd ../frontend
          npm install
          npm run build
          pm2 restart nalmifx-frontend || echo "Frontend served via nginx"

          echo "✅ Deployment completed successfully!"
